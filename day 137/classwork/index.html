    <h1 class="text">H1</h1>
    <p id="par">P</p>

    <!-- tag - სელექტორი გამოიყენება მაშინ, როდესაც ყველა ერთნაირ თაგს ერთი და იგივე ისტილი ეწერება -->

    <h3>dadada</h3>
    <h3>h3</h3>


    <!-- inline-stye- არის ყველაზე დიდი პრიორიტეტის მქონე -->
    <!-- IDs პრიორიტეტული არის იმ შემთხვევაში თუ ინლაინ ციესესით არ გვაქვს თაგი გასტილული -->
    <!--classes პრიორიტეტული არის იმ შემთხვევაში თუ  არ გვაქვს აიდებით თაგს  მინიჭებული მნიშვნელობა  -->
    <!-- element არის ყველაზე ნაკლებად პრიორიტეტული -->
</body>
