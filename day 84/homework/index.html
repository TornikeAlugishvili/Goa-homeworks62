<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LotoDrone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <h1>PLAYER 1 SCORES <span id="human">0</span></h1>
        <h1>PLAYER 2 SCORES <span id="robot">0</span></h1>
    </div>
    
    <div id="heading1">
        <h1 id="result">WON</h1>
    </div>
    
    <div id="parent-container">
        <div id="container1">
            <h1>Player 1</h1>
            <div id="Quadrilateral1" class="Quadrilateral">
                <div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
                
                <div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
            </div>
        </div>
        
        <div id="container2">
            <h1>Player 2</h1>
            <div id="Quadrilateral2" class="Quadrilateral">
                <div>
                    <div class="circle2"></div>
                    <div class="circle2"></div>
                    <div class="circle2"></div>
                </div>
                
                <div>
                    <div class="circle2"></div>
                    <div class="circle2"></div>
                    <div class="circle2"></div>
                </div>
                
                
            </div>
        </div>
        
    </div>
    <div id="btn">
        <button id="butonashvili">Start</button>
    </div>
    
    <div id="black"></div>
    <script src="script.js"></script>
</body>

</html>
